<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="820" viewBox="0 0 1300 820"><defs><marker id="pf" markerWidth="10" markerHeight="10" refX="9" refY="3.2" orient="auto"><path d="M0,0 L9,3.2 L0,6.4 z" fill="#444444"/></marker></defs><rect x="0" y="0" width="1300" height="820" fill="#ffffff"/><polygon points="880,400 765,599.186 535,599.186 420,400 535,200.814 765,200.814" fill="#dff0e4" stroke="#1e6b3a" stroke-width="3"/><polygon points="824,400 737,550.688 563,550.688 476,400 563,249.312 737,249.312" fill="#ffffff" stroke="#1e6b3a" stroke-width="2" stroke-dasharray="8 5"/><text x="650" y="308" font-family="DejaVu Sans, Verdana, sans-serif" font-size="15" fill="#1e6b3a" font-weight="bold" text-anchor="middle">NÚCLEO DE DOMÍNIO</text><text x="650" y="338" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" fill="#222222" font-weight="normal" text-anchor="middle">Ocorrência · Categoria · Localização</text><text x="650" y="357" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" fill="#222222" font-weight="normal" text-anchor="middle">Prioridade · Situação · Bairro</text><text x="650" y="402" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13.5" fill="#111111" font-weight="bold" text-anchor="middle">Regras de negócio</text><text x="650" y="426" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#333333" font-weight="normal" text-anchor="middle">política de priorização por categoria,</text><text x="650" y="445" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#333333" font-weight="normal" text-anchor="middle">reincidência e impacto; máquina de</text><text x="650" y="464" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#333333" font-weight="normal" text-anchor="middle">situações da ocorrência; validação</text><text x="650" y="483" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#333333" font-weight="normal" text-anchor="middle">dos dados do registro</text><text x="650" y="512" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" fill="#555555" font-weight="normal" text-anchor="middle" font-style="italic">não conhece HTTP, banco nem fornecedor</text><text x="650" y="232" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" fill="#1e6b3a" font-weight="bold" text-anchor="middle">PORTAS</text><text x="40" y="150" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" fill="#8a5a00" font-weight="bold" text-anchor="start">Adaptadores primários</text><rect x="40" y="196" width="270" height="86" rx="8" fill="#fbeed2" stroke="#8a5a00" stroke-width="2.2"/><text x="175" y="224" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" fill="#111111" font-weight="bold" text-anchor="middle">Controlador REST</text><text x="175" y="244" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11.5" fill="#444444" font-weight="normal" text-anchor="middle">[NestJS]</text><text x="175" y="266" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11.5" fill="#333333" font-weight="normal" text-anchor="middle">recebe POST /ocorrencias</text><line x1="314" y1="239" x2="420" y2="340" stroke="#444444" stroke-width="2.4" marker-end="url(#pf)"/><rect x="40" y="300" width="270" height="86" rx="8" fill="#fbeed2" stroke="#8a5a00" stroke-width="2.2"/><text x="175" y="328" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" fill="#111111" font-weight="bold" text-anchor="middle">Aplicativo móvel</text><text x="175" y="348" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11.5" fill="#444444" font-weight="normal" text-anchor="middle">[React Native]</text><text x="175" y="370" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11.5" fill="#333333" font-weight="normal" text-anchor="middle">mesmo contrato da API</text><line x1="314" y1="343" x2="420" y2="383.68" stroke="#444444" stroke-width="2.4" marker-end="url(#pf)"/><rect x="40" y="404" width="270" height="86" rx="8" fill="#fbeed2" stroke="#8a5a00" stroke-width="2.2"/><text x="175" y="432" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" fill="#111111" font-weight="bold" text-anchor="middle">Tarefa agendada</text><text x="175" y="452" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11.5" fill="#444444" font-weight="normal" text-anchor="middle">[cron]</text><text x="175" y="474" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11.5" fill="#333333" font-weight="normal" text-anchor="middle">reprioriza a fila diária</text><line x1="314" y1="447" x2="420" y2="427.36" stroke="#444444" stroke-width="2.4" marker-end="url(#pf)"/><rect x="40" y="508" width="270" height="86" rx="8" fill="#fbeed2" stroke="#8a5a00" stroke-width="2.2"/><text x="175" y="536" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" fill="#111111" font-weight="bold" text-anchor="middle">Console de administração</text><text x="175" y="556" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11.5" fill="#444444" font-weight="normal" text-anchor="middle">[React]</text><text x="175" y="578" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11.5" fill="#333333" font-weight="normal" text-anchor="middle">categorias e usuários</text><line x1="314" y1="551" x2="420" y2="471.04" stroke="#444444" stroke-width="2.4" marker-end="url(#pf)"/><text x="40" y="620" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" fill="#555555" font-weight="normal" text-anchor="start" font-style="italic">porta de entrada: casos de uso</text><text x="40" y="644" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" fill="#555555" font-weight="normal" text-anchor="start">RegistrarOcorrencia · AtualizarSituacao</text><text x="40" y="663" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" fill="#555555" font-weight="normal" text-anchor="start">PriorizarDemanda · ConsultarPainel</text><text x="990" y="150" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" fill="#1f4e79" font-weight="bold" text-anchor="start">Adaptadores secundários</text><rect x="990" y="196" width="270" height="86" rx="8" fill="#dce9f5" stroke="#1f4e79" stroke-width="2.2"/><text x="1125" y="224" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" fill="#111111" font-weight="bold" text-anchor="middle">Repositório PostgreSQL</text><text x="1125" y="244" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11.5" fill="#444444" font-weight="normal" text-anchor="middle">[PostGIS]</text><text x="1125" y="266" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11.5" fill="#333333" font-weight="normal" text-anchor="middle">persiste e consulta por área</text><line x1="880" y1="340" x2="986" y2="239" stroke="#444444" stroke-width="2.4" marker-end="url(#pf)"/><rect x="990" y="300" width="270" height="86" rx="8" fill="#dce9f5" stroke="#1f4e79" stroke-width="2.2"/><text x="1125" y="328" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" fill="#111111" font-weight="bold" text-anchor="middle">Publicador de eventos</text><text x="1125" y="348" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11.5" fill="#444444" font-weight="normal" text-anchor="middle">[RabbitMQ]</text><text x="1125" y="370" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11.5" fill="#333333" font-weight="normal" text-anchor="middle">OcorrenciaRegistrada</text><line x1="880" y1="383.68" x2="986" y2="343" stroke="#444444" stroke-width="2.4" marker-end="url(#pf)"/><rect x="990" y="404" width="270" height="86" rx="8" fill="#dce9f5" stroke="#1f4e79" stroke-width="2.2"/><text x="1125" y="432" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" fill="#111111" font-weight="bold" text-anchor="middle">Cliente de geocodificação</text><text x="1125" y="452" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11.5" fill="#444444" font-weight="normal" text-anchor="middle">[API de mapas]</text><text x="1125" y="474" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11.5" fill="#333333" font-weight="normal" text-anchor="middle">endereço → coordenada</text><line x1="880" y1="427.36" x2="986" y2="447" stroke="#444444" stroke-width="2.4" marker-end="url(#pf)"/><rect x="990" y="508" width="270" height="86" rx="8" fill="#dce9f5" stroke="#1f4e79" stroke-width="2.2"/><text x="1125" y="536" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" fill="#111111" font-weight="bold" text-anchor="middle">Cliente do protocolo</text><text x="1125" y="556" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11.5" fill="#444444" font-weight="normal" text-anchor="middle">[API da prefeitura]</text><text x="1125" y="578" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11.5" fill="#333333" font-weight="normal" text-anchor="middle">abre protocolo oficial</text><line x1="880" y1="471.04" x2="986" y2="551" stroke="#444444" stroke-width="2.4" marker-end="url(#pf)"/><text x="990" y="620" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" fill="#555555" font-weight="normal" text-anchor="start" font-style="italic">portas de saída: interfaces do domínio</text><text x="990" y="644" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" fill="#555555" font-weight="normal" text-anchor="start">OcorrenciaRepository · EventoPublisher</text><text x="990" y="663" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" fill="#555555" font-weight="normal" text-anchor="start">GeocodificacaoGateway · ProtocoloGateway</text><text x="650" y="740" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" fill="#555555" font-weight="normal" text-anchor="middle" font-style="italic">A dependência aponta sempre para dentro: o núcleo declara as portas, e os adaptadores as implementam.</text><text x="650" y="766" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" fill="#555555" font-weight="normal" text-anchor="middle" font-style="italic">Trocar o banco, o provedor de mapas ou o sistema da prefeitura é trocar um adaptador, sem tocar na regra de negócio.</text></svg>