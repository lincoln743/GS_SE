<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="860" viewBox="0 0 1300 860"><defs><marker id="pf" markerWidth="10" markerHeight="10" refX="9" refY="3.2" orient="auto"><path d="M0,0 L9,3.2 L0,6.4 z" fill="#444444"/></marker></defs><rect x="0" y="0" width="1300" height="860" fill="#ffffff"/><rect x="380" y="108" width="800" height="640" rx="12" fill="#fbfbfb" stroke="#1e6b3a" stroke-width="2.4" stroke-dasharray="10 6"/><text x="780" y="136" font-family="DejaVu Sans, Verdana, sans-serif" font-size="15" fill="#1e6b3a" font-weight="bold" text-anchor="middle">Neighborhood Action Dashboard</text><rect x="420" y="160" width="320" height="104" rx="8" fill="#dce9f5" stroke="#1f4e79" stroke-width="2.2"/><text x="580" y="186" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" fill="#111111" font-weight="bold" text-anchor="middle">Portal Web</text><text x="580" y="206" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11.5" fill="#444444" font-weight="normal" text-anchor="middle">[React, SPA]</text><text x="580" y="226" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" fill="#333333" font-weight="normal" text-anchor="middle">cidadão registra e acompanha;</text><text x="580" y="243" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" fill="#333333" font-weight="normal" text-anchor="middle">gestor prioriza e encerra</text><rect x="820" y="160" width="320" height="104" rx="8" fill="#dce9f5" stroke="#1f4e79" stroke-width="2.2"/><text x="980" y="186" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" fill="#111111" font-weight="bold" text-anchor="middle">Aplicativo Móvel</text><text x="980" y="206" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11.5" fill="#444444" font-weight="normal" text-anchor="middle">[React Native]</text><text x="980" y="226" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" fill="#333333" font-weight="normal" text-anchor="middle">registro em campo com foto</text><text x="980" y="243" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" fill="#333333" font-weight="normal" text-anchor="middle">e localização do aparelho</text><rect x="520" y="320" width="500" height="112" rx="8" fill="#dff0e4" stroke="#1e6b3a" stroke-width="2.2"/><text x="770" y="346" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" fill="#111111" font-weight="bold" text-anchor="middle">API de Demandas</text><text x="770" y="366" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11.5" fill="#444444" font-weight="normal" text-anchor="middle">[Node.js com NestJS · REST/JSON]</text><text x="770" y="386" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" fill="#333333" font-weight="normal" text-anchor="middle">adaptadores de entrada e núcleo de domínio hexagonal:</text><text x="770" y="403" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" fill="#333333" font-weight="normal" text-anchor="middle">registro, priorização, situação e consulta</text><rect x="420" y="486" width="300" height="100" rx="8" fill="#fbeed2" stroke="#8a5a00" stroke-width="2.2"/><text x="570" y="512" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" fill="#111111" font-weight="bold" text-anchor="middle">Serviço de Notificações</text><text x="570" y="532" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11.5" fill="#444444" font-weight="normal" text-anchor="middle">[worker Node.js]</text><text x="570" y="552" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" fill="#333333" font-weight="normal" text-anchor="middle">consome eventos e avisa</text><text x="570" y="569" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" fill="#333333" font-weight="normal" text-anchor="middle">o cidadão a cada mudança</text><rect x="840" y="486" width="300" height="100" rx="8" fill="#fbeed2" stroke="#8a5a00" stroke-width="2.2"/><text x="990" y="512" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" fill="#111111" font-weight="bold" text-anchor="middle">Agregador de Indicadores</text><text x="990" y="532" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11.5" fill="#444444" font-weight="normal" text-anchor="middle">[worker Node.js]</text><text x="990" y="552" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" fill="#333333" font-weight="normal" text-anchor="middle">consolida o painel por bairro,</text><text x="990" y="569" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" fill="#333333" font-weight="normal" text-anchor="middle">categoria e tempo de resolução</text><rect x="420" y="630" width="300" height="94" rx="8" fill="#e6def7" stroke="#4b2e83" stroke-width="2.2"/><text x="570" y="656" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" fill="#111111" font-weight="bold" text-anchor="middle">Banco de Dados</text><text x="570" y="676" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11.5" fill="#444444" font-weight="normal" text-anchor="middle">[PostgreSQL + PostGIS]</text><text x="570" y="696" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" fill="#333333" font-weight="normal" text-anchor="middle">ocorrências, usuários, categorias</text><text x="570" y="713" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" fill="#333333" font-weight="normal" text-anchor="middle">e consultas por área</text><rect x="840" y="630" width="300" height="94" rx="8" fill="#e6def7" stroke="#4b2e83" stroke-width="2.2"/><text x="990" y="656" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" fill="#111111" font-weight="bold" text-anchor="middle">Fila de Mensagens</text><text x="990" y="676" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11.5" fill="#444444" font-weight="normal" text-anchor="middle">[RabbitMQ]</text><text x="990" y="696" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" fill="#333333" font-weight="normal" text-anchor="middle">desacopla o registro das</text><text x="990" y="713" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" fill="#333333" font-weight="normal" text-anchor="middle">notificações e dos indicadores</text><rect x="40" y="170" width="190" height="86" rx="4" fill="#eaf2fb" stroke="#1f4e79" stroke-width="2"/><text x="135" y="206" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#1f4e79" font-weight="bold" text-anchor="middle">Provedor de</text><text x="135" y="225" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#1f4e79" font-weight="bold" text-anchor="middle">Identidade (gov.br)</text><line x1="234" y1="213" x2="516" y2="340" stroke="#444444" stroke-width="2.4" marker-end="url(#pf)"/><rect x="40" y="290" width="190" height="86" rx="4" fill="#eaf2fb" stroke="#1f4e79" stroke-width="2"/><text x="135" y="326" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#1f4e79" font-weight="bold" text-anchor="middle">Serviço de Mapas e</text><text x="135" y="345" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#1f4e79" font-weight="bold" text-anchor="middle">Geocodificação</text><line x1="234" y1="333" x2="516" y2="365" stroke="#444444" stroke-width="2.4" marker-end="url(#pf)"/><rect x="40" y="410" width="190" height="86" rx="4" fill="#eaf2fb" stroke="#1f4e79" stroke-width="2"/><text x="135" y="446" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#1f4e79" font-weight="bold" text-anchor="middle">Armazenamento de</text><text x="135" y="465" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#1f4e79" font-weight="bold" text-anchor="middle">Mídias (objetos)</text><line x1="234" y1="453" x2="516" y2="390" stroke="#444444" stroke-width="2.4" marker-end="url(#pf)"/><rect x="40" y="530" width="190" height="86" rx="4" fill="#eaf2fb" stroke="#1f4e79" stroke-width="2"/><text x="135" y="566" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#1f4e79" font-weight="bold" text-anchor="middle">Sistema de Protocolo</text><text x="135" y="585" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#1f4e79" font-weight="bold" text-anchor="middle">da Prefeitura</text><line x1="234" y1="573" x2="516" y2="415" stroke="#444444" stroke-width="2.4" marker-end="url(#pf)"/><text x="40" y="676" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11.5" fill="#555555" font-weight="normal" text-anchor="start">Integrações em HTTPS/JSON, sempre</text><text x="40" y="693" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11.5" fill="#555555" font-weight="normal" text-anchor="start">através do adaptador de saída</text><text x="40" y="710" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11.5" fill="#555555" font-weight="normal" text-anchor="start">correspondente — nunca a partir</text><text x="40" y="727" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11.5" fill="#555555" font-weight="normal" text-anchor="start">do núcleo de domínio.</text><line x1="580" y1="268" x2="660" y2="316" stroke="#444444" stroke-width="2.4" marker-end="url(#pf)"/><text x="500" y="300" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11.5" fill="#555555" font-weight="normal" text-anchor="start">HTTPS/JSON</text><line x1="980" y1="268" x2="900" y2="316" stroke="#444444" stroke-width="2.4" marker-end="url(#pf)"/><text x="990" y="300" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11.5" fill="#555555" font-weight="normal" text-anchor="start">HTTPS/JSON</text><line x1="660" y1="436" x2="580" y2="482" stroke="#444444" stroke-width="2.4" marker-end="url(#pf)"/><text x="452" y="470" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11.5" fill="#555555" font-weight="normal" text-anchor="start">publica evento</text><line x1="900" y1="436" x2="980" y2="482" stroke="#444444" stroke-width="2.4" marker-end="url(#pf)"/><text x="992" y="470" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11.5" fill="#555555" font-weight="normal" text-anchor="start">publica evento</text><line x1="570" y1="586" x2="570" y2="626" stroke="#444444" stroke-width="2.4" marker-end="url(#pf)"/><text x="582" y="612" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11.5" fill="#555555" font-weight="normal" text-anchor="start">SQL/TLS</text><line x1="990" y1="586" x2="990" y2="626" stroke="#444444" stroke-width="2.4" marker-end="url(#pf)"/><text x="1002" y="612" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11.5" fill="#555555" font-weight="normal" text-anchor="start">AMQP</text><line x1="720" y1="676" x2="840" y2="676" stroke="#666666" stroke-width="2" stroke-dasharray="7 5"/><text x="780" y="666" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11.5" fill="#555555" font-weight="normal" text-anchor="middle">consome</text><line x1="780" y1="432" x2="780" y2="626" stroke="#444444" stroke-width="2.4" marker-end="url(#pf)"/><text x="792" y="540" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11.5" fill="#555555" font-weight="normal" text-anchor="start">SQL/TLS</text><text x="650" y="790" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#555555" font-weight="normal" text-anchor="middle" font-style="italic">C4 — Nível 2: diagrama de containers. Cada caixa é uma unidade implantável; os rótulos indicam o protocolo de comunicação.</text><text x="650" y="816" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#555555" font-weight="normal" text-anchor="middle" font-style="italic">O núcleo de domínio hexagonal vive dentro da API de Demandas; os demais containers o alcançam apenas por portas.</text></svg>