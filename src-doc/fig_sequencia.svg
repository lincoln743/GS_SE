<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1000" viewBox="0 0 1300 1000"><defs><marker id="pf" markerWidth="10" markerHeight="10" refX="9" refY="3.2" orient="auto"><path d="M0,0 L9,3.2 L0,6.4 z" fill="#444444"/></marker></defs><rect x="0" y="0" width="1300" height="1000" fill="#ffffff"/><rect x="62" y="70" width="96" height="50" rx="4" fill="#ebebeb" stroke="#3f3f3f" stroke-width="2"/><text x="110" y="92" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" fill="#111111" font-weight="bold" text-anchor="middle">: Cidadão</text><text x="110" y="110" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11" fill="#555555" font-weight="normal" text-anchor="middle">ator</text><line x1="110" y1="120" x2="110" y2="940" stroke="#777777" stroke-width="1.4" stroke-dasharray="7 6"/><rect x="260" y="70" width="120" height="50" rx="4" fill="#ebebeb" stroke="#3f3f3f" stroke-width="2"/><text x="320" y="92" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" fill="#111111" font-weight="bold" text-anchor="middle">: Portal Web</text><text x="320" y="110" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11" fill="#555555" font-weight="normal" text-anchor="middle">Interface</text><line x1="320" y1="120" x2="320" y2="940" stroke="#777777" stroke-width="1.4" stroke-dasharray="7 6"/><rect x="460" y="70" width="160" height="50" rx="4" fill="#ebebeb" stroke="#3f3f3f" stroke-width="2"/><text x="540" y="92" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" fill="#111111" font-weight="bold" text-anchor="middle">: API de Demandas</text><text x="540" y="110" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11" fill="#555555" font-weight="normal" text-anchor="middle">Adaptador REST</text><line x1="540" y1="120" x2="540" y2="940" stroke="#777777" stroke-width="1.4" stroke-dasharray="7 6"/><rect x="674" y="70" width="192" height="50" rx="4" fill="#ebebeb" stroke="#3f3f3f" stroke-width="2"/><text x="770" y="92" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" fill="#111111" font-weight="bold" text-anchor="middle">: Serviço de Demandas</text><text x="770" y="110" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11" fill="#555555" font-weight="normal" text-anchor="middle">Núcleo de domínio</text><line x1="770" y1="120" x2="770" y2="940" stroke="#777777" stroke-width="1.4" stroke-dasharray="7 6"/><rect x="926" y="70" width="128" height="50" rx="4" fill="#ebebeb" stroke="#3f3f3f" stroke-width="2"/><text x="990" y="92" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" fill="#111111" font-weight="bold" text-anchor="middle">: Repositório</text><text x="990" y="110" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11" fill="#555555" font-weight="normal" text-anchor="middle">PostgreSQL</text><line x1="990" y1="120" x2="990" y2="940" stroke="#777777" stroke-width="1.4" stroke-dasharray="7 6"/><rect x="1130" y="70" width="120" height="50" rx="4" fill="#ebebeb" stroke="#3f3f3f" stroke-width="2"/><text x="1190" y="92" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" fill="#111111" font-weight="bold" text-anchor="middle">: Publicador</text><text x="1190" y="110" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11" fill="#555555" font-weight="normal" text-anchor="middle">RabbitMQ</text><line x1="1190" y1="120" x2="1190" y2="940" stroke="#777777" stroke-width="1.4" stroke-dasharray="7 6"/><line x1="110" y1="168" x2="318" y2="168" stroke="#1f4e79" stroke-width="2" marker-end="url(#pf)"/><text x="214" y="159" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#111111" font-weight="normal" text-anchor="middle">1: preenche e envia o formulário</text><text x="214" y="186" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11" fill="#555555" font-weight="normal" text-anchor="middle">(categoria, descrição, localização, foto)</text><line x1="320" y1="214" x2="538" y2="214" stroke="#1f4e79" stroke-width="2" marker-end="url(#pf)"/><text x="429" y="205" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#111111" font-weight="normal" text-anchor="middle">2: POST /ocorrencias</text><line x1="540" y1="252" x2="768" y2="252" stroke="#1f4e79" stroke-width="2" marker-end="url(#pf)"/><text x="654" y="243" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#111111" font-weight="normal" text-anchor="middle">3: registrarOcorrencia(dados)</text><rect x="763" y="272" width="14" height="40" fill="#ffffff" stroke="#555555" stroke-width="1.6"/><line x1="770" y1="282" x2="820" y2="282" stroke="#1f4e79" stroke-width="2" marker-end="url(#pf)"/><line x1="820" y1="282" x2="820" y2="302" stroke="#1f4e79" stroke-width="2"/><line x1="820" y1="302" x2="776" y2="302" stroke="#1f4e79" stroke-width="2" marker-end="url(#pf)"/><text x="830" y="278" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#111111" font-weight="normal" text-anchor="start">4: validar(dados)</text><rect x="60" y="330" width="1200" height="570" rx="4" fill="none" stroke="#9b1c31" stroke-width="2.2"/><polygon points="60,330 150,330 150,354 138,366 60,366" fill="#fadde2" stroke="#9b1c31" stroke-width="2.2"/><text x="76" y="352" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13.5" fill="#9b1c31" font-weight="bold" text-anchor="start">alt</text><text x="170" y="352" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#9b1c31" font-weight="bold" text-anchor="start">[dados válidos e persistência disponível] — fluxo principal</text><line x1="770" y1="400" x2="988" y2="400" stroke="#1f4e79" stroke-width="2" marker-end="url(#pf)"/><text x="879" y="391" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#111111" font-weight="normal" text-anchor="middle">5: salvar(ocorrência, situação = ABERTA)</text><line x1="990" y1="436" x2="772" y2="436" stroke="#8a5a00" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#pf)"/><text x="881" y="427" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#111111" font-weight="normal" text-anchor="middle">6: protocolo gerado</text><line x1="770" y1="474" x2="1188" y2="474" stroke="#1f4e79" stroke-width="2" marker-end="url(#pf)"/><text x="979" y="465" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#111111" font-weight="normal" text-anchor="middle">7: publicar(OcorrenciaRegistrada)</text><line x1="768" y1="512" x2="542" y2="512" stroke="#8a5a00" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#pf)"/><text x="655" y="503" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#111111" font-weight="normal" text-anchor="middle">8: protocolo</text><line x1="538" y1="548" x2="322" y2="548" stroke="#8a5a00" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#pf)"/><text x="430" y="539" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#111111" font-weight="normal" text-anchor="middle">9: 201 Created + protocolo</text><line x1="320" y1="584" x2="112" y2="584" stroke="#8a5a00" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#pf)"/><text x="216" y="575" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#111111" font-weight="normal" text-anchor="middle">10: exibe o protocolo de acompanhamento</text><line x1="60" y1="610" x2="1260" y2="610" stroke="#9b1c31" stroke-width="1.8" stroke-dasharray="9 6"/><text x="170" y="634" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#9b1c31" font-weight="bold" text-anchor="start">[dados inválidos] — fluxo alternativo A1</text><line x1="768" y1="672" x2="542" y2="672" stroke="#8a5a00" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#pf)"/><text x="655" y="663" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#111111" font-weight="normal" text-anchor="middle">5a: ErroDeValidacao(campos)</text><line x1="538" y1="710" x2="322" y2="710" stroke="#8a5a00" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#pf)"/><text x="430" y="701" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#111111" font-weight="normal" text-anchor="middle">6a: 422 com o erro por campo</text><line x1="320" y1="746" x2="112" y2="746" stroke="#8a5a00" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#pf)"/><text x="216" y="737" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#111111" font-weight="normal" text-anchor="middle">7a: destaca os campos e solicita correção</text><line x1="60" y1="772" x2="1260" y2="772" stroke="#9b1c31" stroke-width="1.8" stroke-dasharray="9 6"/><text x="170" y="796" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#9b1c31" font-weight="bold" text-anchor="start">[falha ao salvar] — fluxo alternativo A2</text><line x1="988" y1="834" x2="774" y2="834" stroke="#8a5a00" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#pf)"/><text x="881" y="825" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#111111" font-weight="normal" text-anchor="middle">5b: falha de persistência</text><line x1="538" y1="870" x2="322" y2="870" stroke="#8a5a00" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#pf)"/><text x="430" y="861" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#111111" font-weight="normal" text-anchor="middle">6b: 503 — indisponível, tente novamente</text><text x="690" y="882" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" fill="#333333" font-weight="normal" text-anchor="middle">7b: o Portal Web mantém o rascunho local e oferece reenvio; nenhum dado digitado pelo cidadão é perdido</text><text x="650" y="964" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#555555" font-weight="normal" text-anchor="middle" font-style="italic">Cenário crítico: Registrar ocorrência. As mensagens tracejadas são retornos.</text></svg>