<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="700" viewBox="0 0 1260 700"><defs><marker id="pf" markerWidth="10" markerHeight="10" refX="9" refY="3.2" orient="auto"><path d="M0,0 L9,3.2 L0,6.4 z" fill="#444444"/></marker></defs><rect x="0" y="0" width="1260" height="700" fill="#ffffff"/><polygon points="180,360 480,360 570,540 90,540" fill="#dff0e4" stroke="#1e6b3a" stroke-width="2.2"/><polygon points="260,200 400,200 480,360 180,360" fill="#dce9f5" stroke="#1f4e79" stroke-width="2.2"/><polygon points="330,60 400,200 260,200" fill="#fadde2" stroke="#9b1c31" stroke-width="2.2"/><text x="330" y="172" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" fill="#9b1c31" font-weight="bold" text-anchor="middle">End-to-End</text><text x="330" y="300" font-family="DejaVu Sans, Verdana, sans-serif" font-size="19" fill="#1f4e79" font-weight="bold" text-anchor="middle">Integração</text><text x="330" y="460" font-family="DejaVu Sans, Verdana, sans-serif" font-size="21" fill="#1e6b3a" font-weight="bold" text-anchor="middle">Unitários</text><text x="330" y="194" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11.5" fill="#9b1c31" font-weight="normal" text-anchor="middle">poucos · caros · lentos</text><text x="330" y="324" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#1f4e79" font-weight="normal" text-anchor="middle">alguns · custo médio</text><text x="330" y="486" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" fill="#1e6b3a" font-weight="normal" text-anchor="middle">muitos · rápidos · de baixo custo</text><rect x="650" y="60" width="580" height="140" rx="10" fill="#fadde2" stroke="#9b1c31" stroke-width="2.2"/><text x="670" y="88" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14.5" fill="#9b1c31" font-weight="bold" text-anchor="start">End-to-End — o fluxo pelos olhos do usuário</text><text x="670" y="114" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#222222" font-weight="normal" text-anchor="start">E1  cidadão registra a ocorrência e recebe o protocolo</text><text x="670" y="133" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#222222" font-weight="normal" text-anchor="start">E2  gestor prioriza, atualiza a situação e encerra</text><text x="670" y="152" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#222222" font-weight="normal" text-anchor="start">E3  cidadão consulta o andamento pelo protocolo</text><text x="670" y="182" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11.5" fill="#555555" font-weight="normal" text-anchor="start" font-style="italic">execução noturna e antes de cada entrega</text><rect x="650" y="214" width="580" height="152" rx="10" fill="#dce9f5" stroke="#1f4e79" stroke-width="2.2"/><text x="670" y="242" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14.5" fill="#1f4e79" font-weight="bold" text-anchor="start">Integração — a conversa entre as peças</text><text x="670" y="268" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#222222" font-weight="normal" text-anchor="start">API de ocorrências gravando e consultando no PostgreSQL</text><text x="670" y="287" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#222222" font-weight="normal" text-anchor="start">consulta geoespacial por bairro com PostGIS</text><text x="670" y="306" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#222222" font-weight="normal" text-anchor="start">publicação e consumo do evento OcorrenciaRegistrada</text><text x="670" y="325" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#222222" font-weight="normal" text-anchor="start">adaptador de geocodificação e do protocolo da prefeitura</text><text x="670" y="344" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#222222" font-weight="normal" text-anchor="start">upload de mídia no armazenamento de objetos</text><rect x="650" y="380" width="580" height="160" rx="10" fill="#dff0e4" stroke="#1e6b3a" stroke-width="2.2"/><text x="670" y="408" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14.5" fill="#1e6b3a" font-weight="bold" text-anchor="start">Unitários — as regras, isoladas e sem E/S</text><text x="670" y="434" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#222222" font-weight="normal" text-anchor="start">política de priorização por categoria, reincidência e impacto</text><text x="670" y="453" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#222222" font-weight="normal" text-anchor="start">validação dos campos obrigatórios da ocorrência</text><text x="670" y="472" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#222222" font-weight="normal" text-anchor="start">máquina de situações: Aberta → Em análise → Em execução →</text><text x="670" y="491" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#222222" font-weight="normal" text-anchor="start">Concluída / Recusada, e as transições proibidas</text><text x="670" y="510" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#222222" font-weight="normal" text-anchor="start">cálculo do prazo previsto por categoria</text><rect x="60" y="572" width="1170" height="104" rx="10" fill="#fbeed2" stroke="#8a5a00" stroke-width="2.2" stroke-dasharray="8 5"/><text x="80" y="600" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" fill="#8a5a00" font-weight="bold" text-anchor="start">Critério de parada</text><text x="80" y="626" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#222222" font-weight="normal" text-anchor="start">Cobertura de 80 % de instruções e 70 % de ramos no pacote de domínio; sem meta para adaptadores gerados.</text><text x="80" y="645" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#222222" font-weight="normal" text-anchor="start">Cobertura mede execução, não detecção: nenhuma funcionalidade é considerada pronta sem os critérios da Definition of Done.</text></svg>