 y="340" width="300" height="108" rx="4" fill="#eaf2fb" stroke="#1f4e79" stroke-width="2.2"/><text x="1090" y="368" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13.5" fill="#1f4e79" font-weight="bold" text-anchor="middle">Sistema de Protocolo</text><text x="1090" y="387" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13.5" fill="#1f4e79" font-weight="bold" text-anchor="middle">da Prefeitura</text><text x="1090" y="414" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11.5" fill="#444444" font-weight="normal" text-anchor="middle">integra a demanda ao fluxo</text><text x="1090" y="430" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11.5" fill="#444444" font-weight="normal" text-anchor="middle">oficial de atendimento</text><line x1="864" y1="390" x2="936" y2="394" stroke="#444444" stroke-width="2.4" marker-end="url(#pf)"/><rect x="940" y="490" width="300" height="108" rx="4" fill="#eaf2fb" stroke="#1f4e79" stroke-width="2.2"/><text x="1090" y="518" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13.5" fill="#1f4e79" font-weight="bold" text-anchor="middle">Serviço de Notificação</text><text x="1090" y="537" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13.5" fill="#1f4e79" font-weight="bold" text-anchor="middle">(e-mail e push)</text><text x="1090" y="564" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11.5" fill="#444444" font-weight="normal" text-anchor="middle">informa o cidadão a cada</text><text x="1090" y="580" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11.5" fill="#444444" font-weight="normal" text-anchor="middle">mudança de situação</text><line x1="864" y1="390" x2="936" y2="544" stroke="#444444" stroke-width="2.4" marker-end="url(#pf)"/><rect x="940" y="640" width="300" height="108" rx="4" fill="#eaf2fb" stroke="#1f4e79" stroke-width="2.2"/><text x="1090" y="668" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13.5" fill="#1f4e79" font-weight="bold" text-anchor="middle">Armazenamento de</text><text x="1090" y="687" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13.5" fill="#1f4e79" font-weight="bold" text-anchor="middle">Mídias</text><text x="1090" y="714" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11.5" fill="#444444" font-weight="normal" text-anchor="middle">guarda as fotos enviadas</text><text x="1090" y="730" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11.5" fill="#444444" font-weight="normal" text-anchor="middle">junto da ocorrência</text><line x1="864" y1="390" x2="936" y2="694" stroke="#444444" stroke-width="2.4" marker-end="url(#pf)"/><text x="40" y="700" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" fill="#111111" font-weight="bold" text-anchor="start">Pessoas</text><text x="940" y="700" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" fill="#111111" font-weight="bold" text-anchor="start">Sistemas externos</text><text x="640" y="730" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#555555" font-weight="normal" text-anchor="middle" font-style="italic">C4 — Nível 1: diagrama de contexto. As setas indicam a finalidade de cada interação.</text></svg>